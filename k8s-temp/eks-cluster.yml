apiVersion: eksctl.io/v1alpha5

kind: ClusterConfig

metadata:
  name: todo-app-eks
  region: ap-south-1
  version: "1.31"

vpc:
  id: "vpc-09b5517672ba58395"
  subnets:
    private:
      ap-south-1a:
        id: "subnet-0931179111a065fbe"
      ap-south-1b:
        id: "subnet-0a1ffee201361ae5a"
    public:
      ap-south-1a:
        id: "subnet-003d75fec27a578ed"
      ap-south-1b:
        id: "subnet-040f3ae1f344571f3"

managedNodeGroups:
  - name: todo-app-nodes
    instanceType: t3.medium
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: false

iam:
  withOIDC: true
